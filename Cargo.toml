[package]
name = "diktator"
version = "0.12.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "Lokales Windows-Diktat mit eingebettetem Parakeet v3"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
libloading = "0.8.9"
chrono = { version = "0.4.42", features = ["serde"] }
regex = "1.12.2"
unicode-segmentation = "1.12.0"
hound = "3.5.1"
symphonia = { version = "0.5.5", features = ["all"] }

[target.'cfg(windows)'.dependencies]
cpal = "0.16.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_DataExchange", "Win32_Media_Audio", "Win32_Networking_WinHttp", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
